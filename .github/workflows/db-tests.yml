name: Database Integration Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest Database Tests & Generate Reports
        run: npx jest --runInBand --detectOpenHandles
        env:
          CI: true

      # Upload test reports as pipeline artifacts for auditing
      - name: Upload Test Execution Reports
        uses: actions/upload-artifact@v4
        if: always() # Ensures reports are uploaded even if tests fail
        with:
          name: database-test-reports-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 30